services:
  # ============================================
  # Next.js Application (Tiệm Nhỏ)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://tiemnho.vn}
    container_name: tiemnho-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://tiemnho:tiemnho_secret_password@postgres:5432/tiemnho_db?schema=public
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # Database: PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tiemnho-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: tiemnho
      POSTGRES_PASSWORD: tiemnho_secret_password
      POSTGRES_DB: tiemnho_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiemnho -d tiemnho_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
