services:
  # ============================================
  # Next.js Application (Tiệm Nhỏ)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://tiemnho.vn}
    container_name: tiemnho-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3088}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tiemnho}:${POSTGRES_PASSWORD:-tiemnho_secret_password}@postgres:5432/${POSTGRES_DB:-tiemnho_db}?schema=public
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # Database Management: Prisma Studio (db.tiemnho.shop)
  # ============================================
  studio:
    image: node:22-slim
    container_name: tiemnho-studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma
    ports:
      - '127.0.0.1:5555:5555'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tiemnho}:${POSTGRES_PASSWORD:-tiemnho_secret_password}@postgres:5432/${POSTGRES_DB:-tiemnho_db}?schema=public
    command: sh -c "apt-get update && apt-get install -y openssl && npx prisma@6 studio --port 5555 --hostname 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # Database: PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tiemnho-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DB_PORT:-5488}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiemnho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiemnho_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-tiemnho_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tiemnho} -d ${POSTGRES_DB:-tiemnho_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
